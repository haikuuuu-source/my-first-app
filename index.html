<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>درب · Darb — Learn Nahw in 10 Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#F7F1E1;
  --parchment-deep:#EFE6CC;
  --ink:#22281F;
  --ink-soft:#5B6156;
  --teal:#0B5D5D;
  --teal-deep:#083F3F;
  --teal-tint:#E3EFEE;
  --gold:#C9A227;
  --gold-soft:#E8D48B;
  --terracotta:#B3432F;
  --terracotta-tint:#F6E1DB;
  --line:#DCD2B4;
  --radius:18px;
  --shadow:0 2px 0 rgba(34,40,31,0.06), 0 8px 24px rgba(34,40,31,0.08);
  /* cosmic layer */
  --night-1:#151233;
  --night-2:#231A4D;
  --night-3:#33215E;
  --star-gold:#F3C969;
  --star-gold-soft:#FFE7AE;
  --bloom:#FF9E62;
  --teal-bright:#3FE0C8;
  --violet-glow:#B98CE8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 120% 60% at 20% -10%, rgba(185,140,232,0.25), transparent 60%),
    radial-gradient(ellipse 100% 50% at 100% 0%, rgba(63,224,200,0.14), transparent 55%),
    linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  min-height:100vh;
}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.star-pt{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3.2s ease-in-out infinite;}
@keyframes twinkle{
  0%,100%{opacity:0.15;}
  50%{opacity:0.95;}
}
.comet{
  position:absolute;left:-10%;width:70px;height:2px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  transform:rotate(18deg);
  animation:cometFly 7s linear infinite;
  opacity:0;
}
@keyframes cometFly{
  0%{transform:translateX(0) rotate(18deg);opacity:0;}
  5%{opacity:0.9;}
  35%{opacity:0;}
  100%{transform:translateX(480px) rotate(18deg);opacity:0;}
}
.arabic{font-family:'Amiri',serif;direction:rtl;}
h1,h2,h3{font-family:'Amiri',serif;margin:0;letter-spacing:0.2px;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* ---------- TOP BAR ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--night-1) 70%, rgba(21,18,51,0));
  backdrop-filter:blur(2px);
}
.stat-pill{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:100px;
  font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);
  color:var(--star-gold-soft);backdrop-filter:blur(4px);
}
.stat-pill.streak{color:#FF9E7A;}
.stat-pill.xp{color:var(--star-gold);}
.stat-pill.hearts{color:#FF9E7A;}
.stat-icon{width:16px;height:16px;flex:none;}

/* ---------- SCREENS ---------- */
.screen{display:none;flex:1;flex-direction:column;padding-bottom:40px;}
.screen.active{display:flex;}

/* ---------- HOME / PATH ---------- */
.path-header{padding:6px 24px 18px;}
.path-header .eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:var(--violet-glow);margin-bottom:6px;
}
.path-header h1{font-size:30px;color:#fff;}
.path-header h1 .arabic{font-size:26px;color:var(--star-gold);margin-inline-end:8px;}
.path-header h1.solo{font-size:42px;color:var(--star-gold);line-height:1.15;text-shadow:0 0 20px rgba(243,201,105,0.35);}
.section-h1{font-size:27px;color:#fff;}
.rank-line{margin-top:6px;font-size:13px;color:#C9C3E8;}
.rank-line b{color:var(--teal-bright);}

.trail{position:relative;padding:20px 0 60px;}
.trail-svg-line{position:absolute;left:50%;top:0;width:3px;height:100%;transform:translateX(-50%);
  background:repeating-linear-gradient(180deg, rgba(243,201,105,0.5) 0 8px, transparent 8px 16px);
  z-index:0;border-radius:4px;}
.station{
  position:relative;z-index:1;display:flex;align-items:center;gap:16px;
  padding:14px 24px;
}
.station:nth-child(even){flex-direction:row-reverse;}
.station-node{
  width:76px;height:76px;flex:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;position:relative;
  border:2px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.06);
  backdrop-filter:blur(3px);
  transition:transform .15s ease;
}
.station-node.done{
  background:radial-gradient(circle at 35% 30%, var(--star-gold-soft), var(--star-gold) 70%);
  border-color:var(--star-gold);
  box-shadow:0 0 22px rgba(243,201,105,0.55);
  animation:warpIn .5s cubic-bezier(.2,.9,.3,1.2);
}
.station-node.current{
  border-color:var(--teal-bright);
  background:radial-gradient(circle at 35% 30%, rgba(63,224,200,0.35), rgba(255,255,255,0.05) 75%);
  animation:pulse 2.2s infinite;
  box-shadow:0 0 18px rgba(63,224,200,0.35);
}
.station-node.locked{opacity:0.35;}
.station-node button{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.station-node svg{width:48px;height:48px;}
.station-node.done svg{width:62px;height:62px;}
.station-node.current svg{width:46px;height:46px;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(63,224,200,0.35);}
  70%{box-shadow:0 0 0 16px rgba(63,224,200,0);}
  100%{box-shadow:0 0 0 0 rgba(63,224,200,0);}
}
@keyframes warpIn{
  0%{transform:scale(0.4);opacity:0;}
  70%{transform:scale(1.08);opacity:1;}
  100%{transform:scale(1);}
}
.rosette{width:38px;height:38px;}
.station-num{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#fff;
}
.station-node.done .station-num{color:var(--night-1);}
.station-node.locked .station-num{color:#8983B8;}
.station-card{
  background:linear-gradient(165deg, rgba(250,246,232,0.99), rgba(240,233,210,0.96));
  border:1px solid rgba(255,255,255,0.55);border-radius:14px;padding:12px 14px;
  flex:1;box-shadow:0 10px 26px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.6);
}
.station-card .day-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);}
.station-card h3{font-size:16px;color:var(--ink);margin-top:2px;}
.station-card .ar-title{font-size:15px;color:var(--teal);}
.station-card .prog{font-size:11px;color:var(--ink-soft);margin-top:4px;font-family:'JetBrains Mono',monospace;}


/* ---------- LESSON SCREEN ---------- */
.lesson-top{display:flex;align-items:center;gap:12px;padding:16px 18px;}
.close-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#C9C3E8;flex:none;}
.close-btn:hover{background:rgba(255,255,255,0.08);}
.progress-track{flex:1;height:12px;border-radius:100px;background:rgba(255,255,255,0.08);overflow:hidden;border:1px solid rgba(255,255,255,0.15);}
.progress-fill{height:100%;background:linear-gradient(90deg, var(--teal-bright), var(--star-gold));border-radius:100px;transition:width .35s ease;}
.hearts-mini{display:flex;gap:4px;flex:none;color:#FF6B6B;}
.heart-icon{width:19px;height:19px;filter:drop-shadow(0 0 4px rgba(255,107,107,0.55));transition:transform .2s ease;}
.hearts-mini.heart-lost{animation:heartLostPulse .4s ease;}
@keyframes heartLostPulse{
  0%{transform:scale(1);}
  30%{transform:scale(1.18);}
  100%{transform:scale(1);}
}

.exercise-wrap{flex:1;display:flex;flex-direction:column;padding:10px 24px 24px;}
.ex-kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--star-gold);margin-bottom:10px;}

.ex-header-card{
  background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
  border:1px solid rgba(255,255,255,0.14);border-radius:18px;
  padding:20px 20px 18px;margin-bottom:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.07);
}
.ex-header-card .ex-kicker{margin-bottom:12px;}
.ex-header-card .ex-prompt{margin-bottom:0;}
.ex-header-card .ex-sub{margin-top:8px;margin-bottom:0;}

/* ---------- PLATFORMER MINIGAME ---------- */
.stage{
  position:relative;width:100%;height:290px;margin-bottom:4px;
  background:radial-gradient(ellipse 90% 60% at 50% 100%, rgba(63,224,200,0.08), transparent 70%);
  border:1px solid rgba(255,255,255,0.1);border-radius:20px;overflow:hidden;
}
.stage-launchpad{
  position:absolute;left:1%;bottom:8%;width:15%;height:8px;border-radius:100px;
  background:linear-gradient(90deg, var(--teal-bright), transparent);opacity:0.5;
}
.stage-astro{
  position:absolute;left:2%;bottom:6%;width:30px;height:42px;z-index:20;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,0.4));
  transform-origin:50% 100%;
}
.stage-astro:not(.jumping):not(.launch-squash):not(.landing-squash) .astro-sprite{
  animation:readyPulse 1.9s ease-in-out infinite;
}
.astro-sprite{width:100%;height:100%;display:block;transform-origin:50% 50%;}
@keyframes readyPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.035);}
}
.stage-astro.launch-squash{animation:launchSquash .11s ease-in forwards;}
@keyframes launchSquash{
  0%{transform:scale(1,1);}
  100%{transform:scale(1.22,0.72);}
}
.stage-astro.landing-squash{animation:landingSquash .26s ease-out;}
@keyframes landingSquash{
  0%{transform:scale(1.2,0.75);}
  55%{transform:scale(0.9,1.12);}
  100%{transform:scale(1,1);}
}

.stage-planet{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  cursor:pointer;z-index:5;transition:opacity .3s;
}
.stage-planet.dim{opacity:0.3;}
.planet-icon{width:44px;height:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.35));}
.planet-label{
  margin-top:4px;padding:5px 8px;border-radius:12px;background:rgba(21,18,51,0.85);
  border:1px solid rgba(255,255,255,0.18);white-space:normal;max-width:88px;text-align:center;line-height:1.3;
}
.planet-label .ar{font-family:'Amiri',serif;direction:rtl;font-size:12.5px;color:#fff;display:block;}

.stage-block{
  position:absolute;left:50%;top:-58px;transform:translateX(-50%);width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;animation:blockBob 2.4s ease-in-out infinite;
}
.block-icon{width:34px;height:34px;position:absolute;inset:0;}
.block-q{
  position:relative;z-index:2;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;
  color:var(--night-1);text-shadow:0 1px 0 rgba(255,255,255,0.3);
}
@keyframes blockBob{
  0%,100%{transform:translateX(-50%) translateY(0);}
  50%{transform:translateX(-50%) translateY(-5px);}
}
.stage-block.hit{animation:blockHit .4s ease;}
.stage-block.hit .block-icon{filter:drop-shadow(0 0 8px rgba(243,201,105,0.6));}
.stage-block.correct .block-q{color:#1F7A3D;}
.stage-block.wrong .block-icon{filter:grayscale(0.6) drop-shadow(0 0 6px rgba(255,107,107,0.5));}
.stage-block.wrong .block-q{color:#8C3323;}
.stage-block.correct-reveal{animation:blockBob 2.4s ease-in-out infinite;}
@keyframes blockHit{
  0%{transform:translateX(-50%) translateY(0);}
  30%{transform:translateX(-50%) translateY(-16px);}
  60%{transform:translateX(-50%) translateY(2px);}
  100%{transform:translateX(-50%) translateY(0);}
}

.burst-particle{
  position:absolute;width:6px;height:6px;border-radius:2px;background:var(--star-gold);
  transform:translate(-50%,-50%);z-index:10;pointer-events:none;
  animation:burstFly .7s ease-out forwards;
}
@keyframes burstFly{
  0%{transform:translate(-50%,-50%) translate(0,0) scale(1) rotate(0deg);opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(0.3) rotate(180deg);opacity:0;}
}

.teach-card{
  background:linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
  border:1px solid rgba(255,255,255,0.16);border-radius:22px;
  padding:30px 24px 26px;text-align:center;
  box-shadow:0 12px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
}
.teach-badge{width:76px;height:76px;margin:0 auto 14px;filter:drop-shadow(0 4px 14px rgba(243,201,105,0.35));}
.teach-title{color:#fff;font-size:23px;line-height:1.3;margin-bottom:6px;}
.teach-ar{font-size:18px;color:var(--star-gold);margin-bottom:18px;}
.teach-desc{font-size:15.5px;line-height:1.75;color:#D9D4EE;text-align:left;}
.ex-prompt{font-size:20px;font-weight:600;line-height:1.4;margin-bottom:6px;color:#fff;}
.ex-sub{font-size:14px;color:#C9C3E8;margin-bottom:22px;}
.ex-sentence{
  font-family:'Amiri',serif;direction:rtl;font-size:30px;line-height:2;color:var(--ink);
  background:rgba(247,241,225,0.98);border:1px solid rgba(255,255,255,0.4);border-radius:14px;padding:20px;margin-bottom:22px;
  text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
.tap-word{
  display:inline-block;padding:2px 6px;border-radius:8px;margin:0 2px;
  transition:background .15s, color .15s; cursor:pointer;
}
.tap-word:hover{background:var(--teal-tint);}
.tap-word.picked{background:var(--teal);color:#fff;}
.tap-word.correct{background:#DCEFE0;color:#1F7A3D;}
.tap-word.wrong{background:var(--terracotta-tint);color:var(--terracotta);}

.options{display:flex;flex-direction:column;gap:10px;margin-top:auto;}
.opt-btn{
  text-align:left;padding:16px 18px;border-radius:14px;border:2px solid rgba(255,255,255,0.5);
  background:rgba(247,241,225,0.98);font-size:16px;font-weight:500;color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;
  transition:border-color .15s, background .15s, transform .1s;
}
.opt-btn .ar{font-family:'Amiri',serif;direction:rtl;font-size:19px;}
.opt-btn:active{transform:scale(0.985);}
.opt-btn.selected{border-color:var(--teal);background:var(--teal-tint);}
.opt-btn.correct{border-color:#2E9E52;background:#E4F6E9;color:#1F7A3D;}
.opt-btn.wrong{border-color:var(--terracotta);background:var(--terracotta-tint);color:var(--terracotta);}
.opt-btn:disabled{cursor:default;}

.footer-bar{
  position:sticky;bottom:0;background:linear-gradient(180deg, transparent, var(--night-1) 30%);
  padding:16px 24px 22px;margin-top:18px;
}
.explain-box{
  border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:14px;line-height:1.5;
}
.explain-box.correct{background:#E4F6E9;color:#1F7A3D;}
.explain-box.wrong{background:var(--terracotta-tint);color:#8C3323;}
.explain-box b{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.primary-btn{
  width:100%;padding:16px;border-radius:14px;
  background:linear-gradient(180deg, #5EF0DA, var(--teal-bright));color:var(--night-1);
  font-weight:700;font-size:16px;letter-spacing:0.3px;text-align:center;
  box-shadow:0 4px 0 #1F9C8A, 0 10px 22px rgba(63,224,200,0.25);transition:transform .1s;
}
.primary-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1F9C8A;}
.primary-btn.gold{background:linear-gradient(180deg, #FFE29A, var(--star-gold));box-shadow:0 4px 0 #B8862E, 0 10px 22px rgba(243,201,105,0.25);}
.primary-btn:disabled{background:#4A4570;box-shadow:0 4px 0 #38335A;color:#8983B8;}

/* ---------- RESULT SCREEN ---------- */
.result-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;}
.result-rosette{width:150px;height:150px;margin-bottom:18px;animation:warpIn .55s cubic-bezier(.2,.9,.3,1.2);}
.result-rosette svg{width:100%;height:100%;}
.result-wrap h1{font-size:26px;color:#fff;margin-bottom:6px;}
.result-wrap p{color:#C9C3E8;font-size:14px;margin-bottom:26px;}
.result-stats{display:flex;gap:14px;margin-bottom:30px;}
.rstat{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);border-radius:14px;padding:14px 20px;}
.rstat .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;color:var(--star-gold);}
.rstat .lab{font-size:11px;color:#C9C3E8;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.result-wrap .primary-btn{max-width:280px;}

/* ---------- ACHIEVEMENT TOAST ---------- */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%, 120%);
  background:var(--night-1);color:#fff;padding:14px 20px;border-radius:14px;
  border:1px solid rgba(243,201,105,0.35);
  display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,0.4);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2); z-index:100; max-width:420px;width:90%;
}
.toast.show{transform:translate(-50%,0);}
.toast .t-icon{width:32px;height:32px;flex:none;animation:warpIn .4s cubic-bezier(.2,.9,.3,1.2);}
.toast .t-title{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--star-gold);}
.toast .t-body{font-size:14px;font-weight:600;}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{
  position:sticky;bottom:0;display:flex;background:rgba(21,18,51,0.9);border-top:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(6px);
  z-index:20;
}
.nav-btn{flex:1;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8983B8;min-width:0;}
.nav-btn.active{color:var(--teal-bright);}
.nav-btn svg{width:19px;height:19px;}
.nav-btn span{font-size:8.6px;font-weight:600;letter-spacing:0.1px;white-space:nowrap;}

/* ---------- PROFILE ---------- */
.profile-header{padding:26px 24px 10px;text-align:center;}
.profile-avatar{
  width:92px;height:92px;border-radius:50%;margin:0 auto 12px;
  background:radial-gradient(circle at 35% 65%, rgba(63,224,200,0.18), rgba(255,255,255,0.05) 75%);
  display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,0.22);
  box-shadow:0 0 30px rgba(63,224,200,0.25);
}
.profile-avatar svg{width:72px;height:72px;}
.profile-header h2{font-size:22px;color:#fff;}
.name-display-row{display:inline-flex;align-items:center;gap:8px;cursor:pointer;}
.name-display-row .edit-pencil{width:15px;height:15px;color:#8983B8;}
.name-edit-row{display:flex;align-items:center;gap:8px;justify-content:center;}
.name-input{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);border-radius:10px;
  padding:8px 12px;color:#fff;font-size:18px;font-family:'Amiri',serif;width:180px;text-align:center;
}
.name-input:focus{outline:none;border-color:var(--teal-bright);}
.name-save-btn{
  width:34px;height:34px;border-radius:50%;background:var(--teal-bright);color:var(--night-1);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.name-save-btn svg{width:16px;height:16px;}
.profile-header .rank-tag{
  display:inline-block;margin-top:6px;padding:4px 12px;border-radius:100px;
  background:rgba(63,224,200,0.15);color:var(--teal-bright);font-size:12px;font-weight:700;
  font-family:'JetBrains Mono',monospace;letter-spacing:0.5px;border:1px solid rgba(63,224,200,0.3);
}
.grid-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:18px 24px;}
.grid-stats .gcard{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);border-radius:14px;padding:14px 10px;text-align:center;}
.grid-stats .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;color:var(--star-gold);}
.grid-stats .lab{font-size:10px;color:#C9C3E8;text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.section-title{padding:8px 24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--violet-glow);margin-top:10px;}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 24px 24px;}
.badge{
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);border-radius:14px;padding:14px 8px;
  text-align:center;color:#fff;
}
.badge.locked{opacity:0.35;}
.badge .bi{width:36px;height:36px;margin:0 auto 6px;}
.badge .bt{font-size:10.5px;font-weight:600;line-height:1.3;}
.reset-row{padding:10px 24px 30px;text-align:center;}
.reset-link{font-size:12px;color:#8983B8;text-decoration:underline;}

/* ---------- CHALLENGES ---------- */
.challenge-list{padding:6px 24px 30px;display:flex;flex-direction:column;gap:14px;}
.challenge-card{
  display:flex;gap:14px;padding:16px;border-radius:16px;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 8px 20px rgba(0,0,0,0.22);
}
.challenge-card.done{border-color:rgba(243,201,105,0.5);background:rgba(243,201,105,0.08);}
.challenge-icon{
  width:44px;height:44px;flex:none;border-radius:12px;background:rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;color:var(--star-gold);
}
.challenge-icon svg{width:22px;height:22px;}
.challenge-icon.done{background:var(--star-gold);color:var(--night-1);}
.challenge-body{flex:1;min-width:0;}
.challenge-title{color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;}
.ch-check{width:15px;height:15px;color:var(--star-gold);}
.challenge-desc{font-size:12.5px;color:#C9C3E8;margin:3px 0 10px;}
.challenge-track{height:8px;border-radius:100px;background:rgba(255,255,255,0.1);overflow:hidden;}
.challenge-fill{height:100%;background:linear-gradient(90deg, var(--teal-bright), var(--star-gold));border-radius:100px;transition:width .4s ease;}
.challenge-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8983B8;margin-top:5px;text-align:right;}

/* ---------- INSIGHTS ---------- */
.insight-overall{
  margin:6px 24px 20px;padding:22px;border-radius:18px;text-align:center;
  background:linear-gradient(160deg, rgba(63,224,200,0.14), rgba(243,201,105,0.08));
  border:1px solid rgba(255,255,255,0.15);
}
.insight-overall-num{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:700;color:var(--teal-bright);}
.insight-overall-lab{font-size:12.5px;color:#C9C3E8;margin-top:4px;}
.insight-list{padding:4px 24px 10px;display:flex;flex-direction:column;gap:10px;}
.insight-row{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.13);border-radius:14px;padding:12px 14px;
}
.insight-row-top{display:flex;justify-content:space-between;align-items:baseline;}
.insight-row-title{color:#fff;font-size:13.5px;font-weight:600;}
.insight-row-pct{font-family:'JetBrains Mono',monospace;color:var(--star-gold);font-size:14px;font-weight:700;}
.insight-row-ar{font-size:13px;color:var(--star-gold-soft);opacity:0.8;margin-top:1px;margin-bottom:8px;}
.insight-track{height:6px;border-radius:100px;background:rgba(255,255,255,0.1);overflow:hidden;}
.insight-fill{height:100%;border-radius:100px;transition:width .4s ease;}
.insight-empty, .insight-empty-sm{
  color:#C9C3E8;font-size:13.5px;text-align:center;padding:20px 24px;line-height:1.6;
}
.insight-empty-sm{padding:12px 24px;font-size:12.5px;}

/* ---------- COMPANION (astronaut on the moon) ---------- */
.companion-row{display:flex;align-items:center;gap:12px;padding:2px 24px 16px;}
.companion-box{
  width:56px;height:56px;flex:none;border-radius:16px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:visible;
}
.companion-box svg{width:42px;height:42px;}
.companion-note{font-size:12.5px;color:#C9C3E8;line-height:1.4;}
.companion-note b{color:#fff;}
.companion-box.thriving{border-color:var(--star-gold);box-shadow:0 0 16px rgba(243,201,105,0.4);}
.companion-box.struggling{border-color:#FF9E7A;}
.companion-box.struggling svg{opacity:0.75;}
.leg-slow{animation:legSwing 2.4s ease-in-out infinite;}
.leg-fast{animation:legSwing 1.1s ease-in-out infinite;}
@keyframes legSwing{
  0%,100%{transform:rotate(-9deg);}
  50%{transform:rotate(9deg);}
}

/* ---------- MANUSCRIPT TILE PROGRESS ---------- */
.tile-row{display:flex;gap:6px;flex:1;align-items:center;}
.tile{
  width:20px;height:20px;flex:1;max-width:26px;border-radius:5px;
  transform:rotate(45deg);
  background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.2);
  transition:background .3s ease, border-color .3s ease, transform .3s ease;
}
.tile.filled{
  background:linear-gradient(135deg, var(--star-gold-soft), var(--star-gold));
  border-color:var(--star-gold);
  box-shadow:0 0 8px rgba(243,201,105,0.5);
}
.tile.current{border-color:var(--teal-bright);transform:rotate(45deg) scale(1.12);}

@media (max-width:360px){
  .ex-sentence{font-size:24px;}
  .path-header h1{font-size:25px;}
}
</style>
</head>
<body>
<div id="starfield"></div>
<div id="app"></div>
<div class="toast" id="toast">
  <svg class="t-icon" viewBox="0 0 24 24" fill="none" id="toastIcon"></svg>
  <div>
    <div class="t-title" id="toastTitle">ACHIEVEMENT</div>
    <div class="t-body" id="toastBody">Unlocked something</div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
